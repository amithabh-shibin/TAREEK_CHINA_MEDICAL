        <form id="apptForm" novalidate>
          <div class="fields two">
            <div class="field"><label for="f-name" data-t="contact.name"></label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
            <div class="field"><label for="f-phone" data-t="contact.phone"></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required dir="ltr"></div>
          </div>

            <div class="field"><label for="f-msg" data-t="contact.message"></label><textarea id="f-msg" name="message" data-t-ph="contact.messagePh"></textarea></div>
          </div>
          <button class="btn btn-gold" type="submit" data-t="contact.send"></button>
          <div class="form-msg" id="formMsg" role="status" aria-live="polite"></div>
